[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-preflight"
version = "1.0.0"
description = "Autonomous Trust Fabric — Predictive consequence infrastructure for AI agents. Universal pre-execution governance with risk scoring, sandbox simulation, drift intelligence, and signed action passports."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Apex Poudel"}
]
keywords = [
    "ai", "agents", "safety", "preflight", "governance", "trust",
    "simulation", "risk", "audit", "passport", "drift", "sandbox",
    "langchain", "openai", "anthropic", "openclaw", "mcp", "policy",
    "compliance", "enterprise", "protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
server = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
yaml = ["pyyaml>=6.0"]
all = [
    "langchain-core>=0.1.0", "openai>=1.0.0", "anthropic>=0.20.0",
    "fastapi>=0.100.0", "uvicorn>=0.20.0", "pyyaml>=6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/apexpdl/agent-preflight"
Repository = "https://github.com/apexpdl/agent-preflight"
Issues = "https://github.com/apexpdl/agent-preflight/issues"

[project.scripts]
preflight = "agent_preflight.cli:main"

[tool.setuptools.packages.find]
include = ["agent_preflight*"]
