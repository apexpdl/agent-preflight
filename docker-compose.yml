version: "3.9"

services:
  preflight:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PREFLIGHT_HMAC_KEY=${PREFLIGHT_HMAC_KEY:-}
      - PREFLIGHT_LOG_LEVEL=info
    volumes:
      - preflight-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - preflight

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=preflight
    depends_on:
      - prometheus

volumes:
  preflight-data:
