[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-preflight"
version = "0.1.0"
description = "Preview and validate AI agent actions before execution. The terraform plan for AI agents."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Apex Poudel"}
]
keywords = ["ai", "agents", "safety", "preflight", "preview", "simulation", "langchain", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/apexpdl/agent-preflight"
Repository = "https://github.com/apexpdl/agent-preflight"
Issues = "https://github.com/apexpdl/agent-preflight/issues"

[project.scripts]
preflight = "agent_preflight.cli:main"

[tool.setuptools.packages.find]
include = ["agent_preflight*"]
